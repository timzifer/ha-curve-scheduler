name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach curve_scheduler.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build card
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/curve_scheduler/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/curve_scheduler/manifest.json
      - name: Create zip
        working-directory: custom_components/curve_scheduler
        run: zip -r ../../curve_scheduler.zip . -x "__pycache__/*" "*/__pycache__/*"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: curve_scheduler.zip
